<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <%= htmlWebpackPlugin.options.layout.head %>
</head>
<body>
<%= htmlWebpackPlugin.options.layout.header %>

<main>
    <h1 class="visually-hidden">Royal Cut gallery</h1>

    <!-- Photos are added from team.ts -->
    <section class="rc-gallery" tabindex="0" aria-roledescription="carousel" aria-label="Royal Cut gallery">
        <div class="rc-gallery__viewport">
            <div class="rc-gallery__track"></div>
            <div class="rc-gallery__frame" aria-hidden="true"></div>
        </div>
        <div class="rc-gallery__bar">
            <span class="rc-gallery__count" aria-live="polite"></span>
            <nav class="rc-gallery__pager" aria-label="Gallery navigation"></nav>
            <span class="rc-gallery__hint">Swipe or drag to explore</span>
        </div>
        <div class="rc-gallery__progress"><span class="rc-gallery__progress-fill"></span></div>
    </section>
</main>

<%= htmlWebpackPlugin.options.layout.footer %>
</body>
</html>
