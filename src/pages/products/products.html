<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <%= htmlWebpackPlugin.options.layout.head %>
</head>
<body>
<%= htmlWebpackPlugin.options.layout.header %>

<main>
    <section class="promo">
        <div class="promo__image">
            <img src="/product-images/9.jpg" alt="Hair styling products at Royal Cut">
        </div>
        <div class="promo__text">
            <h1>Hair styling</h1>
            <p>Made for You</p>
        </div>
    </section>

    <section class="shop">
        <div class="filters">
            <form class="search" role="search">
                <input class="search__input" type="search" placeholder="Search by product name" aria-label="Search products">
                <button class="search__button" type="submit" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
                    </svg>
                </button>
            </form>
            <div class="categories" role="group" aria-label="Filter by category">
                <button class="category-btn is-active" type="button" data-category="">All</button>
                <button class="category-btn" type="button" data-category="hair styling">Hair styling</button>
                <button class="category-btn" type="button" data-category="hair care">Hair care</button>
                <button class="category-btn" type="button" data-category="beard">Beard</button>
            </div>
        </div>

        <div class="products" aria-live="polite"></div>
    </section>
</main>

<%= htmlWebpackPlugin.options.layout.footer %>
</body>
</html>
